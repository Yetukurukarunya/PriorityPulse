<!-- Map View Section -->
<div class="card">
    <div class="card-header bg-gradient text-white py-3" style="background: linear-gradient(135deg, var(--accent-gold) 0%, #B8860B 100%);">
        <div class="d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="fas fa-map-marked-alt me-2"></i>Complaint Map View</h4>
            <button class="btn btn-sm btn-light" onclick="resetMap()">
                <i class="fas fa-redo me-1"></i>Reset
            </button>
        </div>
    </div>
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-8">
                <div class="btn-group" role="group">
                    <button class="btn btn-primary" onclick="loadHeatmap()">
                        <i class="fas fa-fire me-2"></i>Show Heatmap
                    </button>
                    <button class="btn btn-info text-white" onclick="loadMarkers()">
                        <i class="fas fa-map-marker-alt me-2"></i>Show Markers
                    </button>
                    <button class="btn btn-outline-secondary" onclick="toggleBoth()">
                        <i class="fas fa-layer-group me-2"></i>Show Both
                    </button>
                </div>
            </div>
            <div class="col-md-4 text-end">
                <select class="form-select form-select-sm" id="severityFilter" onchange="applySeverityFilter()">
                    <option value="all">All Severities</option>
                    <option value="high">High (8-10)</option>
                    <option value="medium">Medium (5-7)</option>
                    <option value="low">Low (1-4)</option>
                </select>
            </div>
        </div>
        
        <div id="map" style="height: 600px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);"></div>
        
        <div class="row mt-3">
            <div class="col-md-12">
                <div class="alert alert-info mb-0">
                    <div class="d-flex align-items-center">
                        <i class="fas fa-info-circle fa-2x me-3"></i>
                        <div>
                            <strong>Map Legend:</strong>
                            <span class="badge bg-danger ms-3">🔴 Emergency (8-10)</span>
                            <span class="badge bg-warning text-dark ms-2">🟠 High (5-7)</span>
                            <span class="badge bg-info ms-2">🟡 Medium (3-4)</span>
                            <span class="badge bg-success ms-2">🟢 Low (1-2)</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>
let map;
let heatLayer = null;
let markersLayer = null;
let allMarkers = [];
let currentView = 'none'; // 'heatmap', 'markers', 'both', 'none'

// Initialize map on page load
document.addEventListener('DOMContentLoaded', function() {
    console.log('Initializing map...');
    
    // Default to city center (you can change these coordinates)
    const defaultLat = 40.7128; // New York
    const defaultLon = -74.0060;
    
    map = L.map('map').setView([defaultLat, defaultLon], 12);
    
    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 18
    }).addTo(map);
    
    console.log('Map initialized. Loading markers...');
    
    // Load markers by default
    setTimeout(() => loadMarkers(), 500);
});

function loadHeatmap() {
    console.log('Loading heatmap...');
    
    // Clear existing layers
    if (heatLayer) map.removeLayer(heatLayer);
    if (currentView === 'markers' || currentView === 'both') {
        if (markersLayer) map.removeLayer(markersLayer);
    }
    
    fetch('/get_heatmap')
        .then(response => response.json())
        .then(data => {
            console.log('Heatmap data received:', data);
            
            if (!data.success || !data.heatmap_data || data.heatmap_data.length === 0) {
                alert('No complaint data available for heatmap');
                return;
            }
            
            const heatPoints = data.heatmap_data.map(point => [
                point.lat || 40.7128, 
                point.lon || -74.0060, 
                Math.min(point.severity / 10, 1.0)
            ]);
            
            console.log('Heat points:', heatPoints.length);
            
            heatLayer = L.heatLayer(heatPoints, {
                radius: 30,
                blur: 20,
                maxZoom: 15,
                minOpacity: 0.5,
                gradient: {
                    0.0: 'blue',
                    0.2: 'cyan',
                    0.4: 'lime',
                    0.6: 'yellow',
                    0.8: 'orange',
                    1.0: 'red'
                }
            }).addTo(map);
            
            currentView = 'heatmap';
            console.log('Heatmap loaded successfully');
        })
        .catch(error => {
            console.error('Error loading heatmap:', error);
            alert('Failed to load heatmap. Check browser console for details.');
        });
}

function loadMarkers() {
    console.log('Loading markers...');
    
    // Clear existing layers
    if (markersLayer) map.removeLayer(markersLayer);
    if (currentView === 'heatmap' || currentView === 'both') {
        if (heatLayer) map.removeLayer(heatLayer);
    }
    
    fetch('/get_heatmap')
        .then(response => response.json())
        .then(data => {
            console.log('Marker data received:', data);
            
            if (!data.success || !data.heatmap_data || data.heatmap_data.length === 0) {
                alert('No complaint data available for markers');
                return;
            }
            
            allMarkers = [];
            const markers = [];
            
            data.heatmap_data.forEach((point, index) => {
                const lat = point.lat || 40.7128;
                const lon = point.lon || -74.0060;
                const severity = point.severity;
                
                // Determine color based on severity
                let color, size;
                if (severity >= 8) {
                    color = '#dc3545'; // Red
                    size = 15;
                } else if (severity >= 5) {
                    color = '#fd7e14'; // Orange
                    size = 12;
                } else if (severity >= 3) {
                    color = '#ffc107'; // Yellow
                    size = 10;
                } else {
                    color = '#28a745'; // Green
                    size = 8;
                }
                
                const marker = L.circleMarker([lat, lon], {
                    radius: size,
                    fillColor: color,
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                });
                
                // Create popup content
                const popupContent = `
                    <div style="min-width: 250px;">
                        <h6 style="color: ${color}; font-weight: bold;">Complaint #${index + 1}</h6>
                        <hr style="margin: 5px 0;">
                        <p><strong>Severity:</strong> 
                            <span style="color: ${color}; font-weight: bold;">${severity}/10</span>
                        </p>
                        <p><strong>Details:</strong><br>
                            <small>${point.complaint || 'No details available'}</small>
                        </p>
                        <p><strong>Coordinates:</strong><br>
                            <small>${lat.toFixed(4)}, ${lon.toFixed(4)}</small>
                        </p>
                    </div>
                `;
                
                marker.bindPopup(popupContent);
                marker.bindTooltip(`Severity: ${severity}/10`, {permanent: false});
                
                markers.push(marker);
                allMarkers.push({
                    marker: marker,
                    severity: severity,
                    lat: lat,
                    lon: lon
                });
            });
            
            markersLayer = L.layerGroup(markers).addTo(map);
            currentView = 'markers';
            
            console.log(`${markers.length} markers loaded`);
            
            // Fit map to show all markers
            if (markers.length > 0) {
                const group = L.featureGroup(markers);
                map.fitBounds(group.getBounds(), {padding: [50, 50]});
            }
        })
        .catch(error => {
            console.error('Error loading markers:', error);
            alert('Failed to load markers. Check browser console for details.');
        });
}

function toggleBoth() {
    console.log('Toggling both views...');
    
    if (currentView === 'heatmap' || currentView === 'none') {
        loadMarkers();
        setTimeout(() => loadHeatmap(), 100);
        currentView = 'both';
    } else {
        resetMap();
    }
}

function applySeverityFilter() {
    const filter = document.getElementById('severityFilter').value;
    console.log('Applying filter:', filter);
    
    if (currentView !== 'markers' && currentView !== 'both') {
        alert('Please switch to markers view first');
        return;
    }
    
    // Clear current markers
    if (markersLayer) map.removeLayer(markersLayer);
    
    const filteredMarkers = allMarkers.filter(item => {
        if (filter === 'all') return true;
        if (filter === 'high') return item.severity >= 8;
        if (filter === 'medium') return item.severity >= 5 && item.severity < 8;
        if (filter === 'low') return item.severity < 5;
        return true;
    });
    
    const markerObjects = filteredMarkers.map(item => item.marker);
    markersLayer = L.layerGroup(markerObjects).addTo(map);
    
    console.log(`Filtered to ${filteredMarkers.length} markers`);
}

function resetMap() {
    console.log('Resetting map...');
    
    // Clear all layers
    if (heatLayer) map.removeLayer(heatLayer);
    if (markersLayer) map.removeLayer(markersLayer);
    
    heatLayer = null;
    markersLayer = null;
    currentView = 'none';
    
    // Reset to default view
    map.setView([40.7128, -74.0060], 12);
    
    // Reset filter
    document.getElementById('severityFilter').value = 'all';
    
    console.log('Map reset complete');
}

// Add refresh functionality
function refreshMapData() {
    console.log('Refreshing map data...');
    if (currentView === 'heatmap') {
        loadHeatmap();
    } else if (currentView === 'markers') {
        loadMarkers();
    } else if (currentView === 'both') {
        loadHeatmap();
        setTimeout(() => loadMarkers(), 100);
    }
}

// Auto-refresh every 30 seconds when map is visible
setInterval(() => {
    const mapView = document.getElementById('tab-map-view');
    if (mapView && mapView.classList.contains('active')) {
        refreshMapData();
    }
}, 30000);
</script>
