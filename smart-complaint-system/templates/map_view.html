{% extends "base.html" %}

{% block title %}Map View{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <i class="fas fa-map-marked-alt"></i> Complaint Heatmap
    </div>
    <div class="card-body">
        <div id="map" style="height: 600px; border-radius: 10px;"></div>
        <div class="mt-3">
            <button class="btn btn-primary" onclick="loadHeatmap()">
                <i class="fas fa-fire"></i> Show Heatmap
            </button>
            <button class="btn btn-info" onclick="loadMarkers()">
                <i class="fas fa-map-marker-alt"></i> Show Markers
            </button>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>
let map;
let currentLayer;

// Initialize map
map = L.map('map').setView([40.7128, -74.0060], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

function loadHeatmap() {
    if (currentLayer) map.removeLayer(currentLayer);
    
    fetch('/get_heatmap')
        .then(response => response.json())
        .then(data => {
            const heatPoints = data.heatmap_data.map(point => [
                point.lat, 
                point.lon, 
                point.severity
            ]);
            currentLayer = L.heatLayer(heatPoints, {
                radius: 25,
                blur: 15,
                maxZoom: 10,
                gradient: {0.2: 'blue', 0.4: 'cyan', 0.6: 'lime', 0.8: 'yellow', 1.0: 'red'}
            }).addTo(map);
        });
}

function loadMarkers() {
    if (currentLayer) map.removeLayer(currentLayer);
    
    fetch('/get_heatmap')
        .then(response => response.json())
        .then(data => {
            const markers = [];
            data.heatmap_data.forEach(point => {
                const color = point.severity >= 8 ? 'red' :
                             point.severity >= 5 ? 'orange' :
                             point.severity >= 3 ? 'yellow' : 'green';
                
                const marker = L.circleMarker([point.lat, point.lon], {
                    radius: 8,
                    fillColor: color,
                    color: '#fff',
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(map);
                
                marker.bindPopup(`
                    <b>Complaint:</b> ${point.complaint}<br>
                    <b>Severity:</b> ${point.severity}/10
                `);
                markers.push(marker);
            });
            currentLayer = L.layerGroup(markers).addTo(map);
        });
}

// Load initial markers
loadMarkers();
</script>
{% endblock %}
